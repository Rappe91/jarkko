<!DOCTYPE HTML>
<html lang="fi">
<html>
<head>
    <title>Rakennuspalvelu J. Kainulainen</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8"> <!-- Updated charset to UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <style>
        /* Thumbnail gallery styles */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .gallery img {
            max-width: 150px;
            cursor: pointer;
            border: 2px solid #ddd;
            border-radius: 5px;
            transition: transform 0.3s, border-color 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
            border-color: #333;
        }

        /* Overlay styles for enlarged image */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .overlay img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }

        .overlay .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: white;
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
    <script type="text/javascript">
        function openOverlay(src) {
            document.getElementById('overlay-image').src = src;
            document.getElementById('image-overlay').style.display = 'flex';
        }

        function closeOverlay() {
            document.getElementById('image-overlay').style.display = 'none';
        }
    </script>
</head>
<body>
<div id="container">
    <div id="header">
        <img src="jarkkologo_banner.png" alt="Jarkko Logo Banner" id="logo-banner">
