<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakennuspalvelu J. Kainulainen</title>

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; upgrade-insecure-requests;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="no-referrer-when-downgrade">

    <!-- Stylesheet -->
    <link rel="stylesheet" type="text/css" href="styles.css">

    <script type="text/javascript">
    function calculatePrice() {
        var rate = document.getElementById('rate').value;
        var hours = document.getElementById('hours').value;
        var total = rate * hours;
        document.getElementById('total').innerText = 'Total Price: EUR ' + total.toFixed(2);
    }
    </script>
</head>
<body>
<div id="container">
    <div id="header">
        <img src="jarkkologo_banner.png" alt="Jarkko Logo Banner" id="logo-banner">
    </div>
    <div id="navigation">
        <p><strong>Navigaatio</strong></p>
        <ul>
            <li><a href="index.html">Koti</a></li>
            <li><a href="contact.html">Yhteystiedot</a></li>
            <li><a href="gallery.html">Kuvagalleria</a></li>
            <li><a href="contact-form.html">Ota yhteyttä</a></li>
            <li><a href="calculator.html">Urakkalaskin</a></li>
        </ul>
    </div>
    <div id="content">
        <h2>Urakkalaskin</h2>
        <form action="#" onsubmit="calculatePrice(); return false;">
            <div class="input-wrapper">
                <input type="number" id="rate" name="rate" step="0.01" min="0" required>
                <label for="rate">Tuntilaskutus euroina</label>
            </div>
            <div class="input-wrapper">
                <input type="number" id="hours" name="hours" step="0.01" min="0" required>
                <label for="hours">Urakan aika tunteina</label>
            </div>
            <input type="submit" value="Laske">
        </form>
        <p id="total">Yhteensä: EUR 0.00</p>
    </div>
	  <div id="wrapper">
    <div id="content">
      <p><strong>Laittaisin tähän yleisimpiä hintoja ja muuta infoa, että tästä on jotain hyötyä</strong></p>
      <p>Työ 1: 5e/h</p>
	  <p>Työ 2: 15e/h</p>
      <p>jne.</p>

    </div>
    <div id="footer">
        <p>Rakennuspalvelu Jarkko Kainulainen TMI</p>
    </div>
</div>
</body>
</html>
